# WSS — dead-man's alert op de devin-cron heartbeat.
#
# wss_cronbeat.sh pusht elke minuut {job="wss-cron", event="CRONBEAT"}
# naar Loki. Geen beats in 10m -> container/cron staat stil -> alert.
#
# Contact point telegram-erik: bottoken komt via env-substitutie
# (${TELEGRAM_BOT_TOKEN}) — zet die env var op de grafana-service in
# Portainer. chatid is niet geheim. Na redeploy/restart laadt Grafana
# dit bestand automatisch.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram-erik
    receivers:
      - uid: wss-cp-telegram-erik
        type: telegram
        settings:
          bottoken: ${TELEGRAM_BOT_TOKEN}
          chatid: "8860629372"
          disable_notifications: false
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: telegram-erik
    group_by: ['grafana_folder', 'alertname']
    routes: []

groups:
  - orgId: 1
    name: wss-heartbeat
    folder: WSS
    interval: 1m
    rules:
      - uid: wss-cronbeat-missing
        title: Devin cron-heartbeat stil
        condition: C
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        isPaused: false
        labels:
          team: wss-ops
        annotations:
          summary: "Geen CRONBEAT in Loki >10m: devin-container of cron staat stil. Check: docker ps / Portainer, daarna cron.d + bridge.log."
        data:
          - refId: A
            datasourceUid: loki
            queryType: instant
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              expr: 'count(count_over_time({job="wss-cron", event="CRONBEAT"}[10m])) or vector(0)'
              instant: true
              range: false
              editorMode: code
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              conditions:
                - evaluator:
                    params: [0, 0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
          - refId: C
            datasourceUid: __expr__
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
