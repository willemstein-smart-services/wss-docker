# wss-syslog — netwerk-syslog ontvanger voor de wss-logs stack.
# Apparaten op het LAN sturen syslog naar 192.168.10.69:514 (udp/tcp).
# Output: JSON-regels in dagelijkse files onder /var/log/syslog-ng/ —
# Alloy tait die map (:ro gemount als /logsrc/syslog) en parst LEVEL/
# HOST/PROGRAM naar Loki-labels (job="syslog").

@version: 4.2
@include "scl.conf"

options {
    keep_hostname(yes);
    use_fqdn(no);
    dns_cache(no);
    time_reopen(10);
    log_msg_size(65536);
};

source s_net {
    udp(ip(0.0.0.0) port(514));
    tcp(ip(0.0.0.0) port(514) max_connections(100));
};

# JSON: S_ISODATE = ontvangsttijd, HOST = apparaat-hostname,
# SOURCE_IP = afzender, LEVEL = severity (emerg..debug),
# MSGONLY = bericht zonder syslog-header.
destination d_loki {
    file("/var/log/syslog-ng/syslog-${YEAR}-${MONTH}-${DAY}.log"
         template("$(format-json ISODATE=$S_ISODATE HOST=$HOST SOURCE_IP=$SOURCEIP FACILITY=$FACILITY LEVEL=$LEVEL PROGRAM=$PROGRAM PID=$PID MSG=$MSGONLY)\n"));
};

log { source(s_net); destination(d_loki); };
