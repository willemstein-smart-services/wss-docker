# WSS stack — devin + draw.io + monitoring
# NAS: /volume1/docker/...  |  Netwerk: docker_network (external)
services:
  devin:
    image: ghcr.io/willemstein-smart-services/wss-devin:latest
    pull_policy: always   # :latest is mutable -> altijd nieuwste pullen bij deploy
    container_name: devin
    hostname: devin
    restart: unless-stopped
    environment:
      TZ: Europe/Amsterdam
      DEVIN_WEB_PASSWORD: "VERVANG_DOOR_STERK_WACHTWOORD"
    volumes:
      # Persistent home: Devin install, chats, ssh-keys, workspace
      - /volume1/docker/devin/home:/home/devin
      # WSS cron + logs (cron.d = volume, geen punt in bestandsnamen!)
      - /volume1/docker/devin/home/cron.d:/etc/cron.d
      - /volume1/docker/devin/home/logs:/var/log/wss
      # Homarr project
      - /volume1/docker/homarr:/home/devin/workspace/homarr
      # Uptime Kuma
      - /volume1/docker/wss_monitoring/uptime-kuma:/home/devin/workspace/uptime-kuma
      # WSS Flows: draw.io docker
      - /volume1/docker/wss_flows:/home/devin/workspace/wss_flows
      # WSS webserver docroot (Devin kan hier bestanden droppen, bv. drawio)
      - /volume1/docker/wss-webserver/www:/home/devin/workspace/web_www
      # WSS backups (lftp-mirror Hetzner + restic) via wss_backup.sh cron
      - /volume1/docker/wss_crons_backups:/home/devin/backups
      # DB van wss-webserver bereikbaar via docker_network: wss-webserver:3306
    working_dir: /home/devin/workspace
    stdin_open: true
    tty: true
    # geen command: nodig — entrypoint start ttyd als devin op :7681
    # (DEVIN_WEB_PASSWORD zet credential devin:<pw> + origin-check)
    networks:
      docker_network:
        ipv4_address: 192.168.10.61

  # ==========================================
  # WSS FLOW - DRAW.IO
  # IP: 192.168.10.63
  # ==========================================
  wss-flows:
    image: jgraph/drawio:latest
    container_name: wss-flows
    hostname: wss-flows
    restart: unless-stopped
    environment:
      TZ: Europe/Amsterdam
      LETS_ENCRYPT_ENABLED: "false"
    volumes:
      - /volume1/docker/wss_flows:/data
    networks:
      docker_network:
        ipv4_address: 192.168.10.63

  # ==========================================
  # WSS MONITORING - UPTIME KUMA
  # IP: 192.168.10.62
  # ==========================================
  wss-monitoring:
    image: ghcr.io/willemstein-smart-services/wss-monitoring:latest
    pull_policy: always
    container_name: wss-monitoring
    hostname: wss-monitoring
    restart: unless-stopped
    environment:
      TZ: Europe/Amsterdam
      MONITOR_WEB_PASSWORD: "VERVANG_DOOR_STERK_WACHTWOORD"
    volumes:
      - /volume1/docker/wss_monitoring:/home/monitor
    stdin_open: true
    tty: true
    networks:
      docker_network:
        ipv4_address: 192.168.10.62

  # ==========================================
  # WSS WEBSERVER - APACHE + PHP + MARIADB (PAC)
  # IP: 192.168.10.64 | http://192.168.10.64 (/adminer.php)
  # DB: wss-webserver:3306 (ook bereikbaar vanuit devin)
  # ==========================================
  wss-webserver:
    image: ghcr.io/willemstein-smart-services/wss-webserver:latest
    pull_policy: always
    container_name: wss-webserver
    hostname: wss-webserver
    restart: unless-stopped
    environment:
      TZ: Europe/Amsterdam
      MYSQL_ROOT_PASSWORD: "VERVANG_DOOR_STERK_WACHTWOORD"
      MYSQL_DATABASE: wss_pac
      MYSQL_USER: wss
      MYSQL_PASSWORD: "VERVANG_DOOR_STERK_WACHTWOORD"
    volumes:
      # Docroot (PAC-site) — Devin mountt dezelfde dir op workspace/web_www
      - /volume1/docker/wss-webserver/www:/var/www/html
      # DB-data (persistent) — leeg = bootstrap + import uit initdb
      - /volume1/docker/wss-webserver/mysql:/var/lib/mysql
      # .sql/.sql.gz hier = auto-import bij eerste boot (bv. wss_db.sql)
      - /volume1/docker/wss-webserver/initdb:/docker-entrypoint-initdb.d
      # php-error.log + mail.log (mail-catcher)
      - /volume1/docker/wss-webserver/logs:/var/log/webstack
      # cronjobs voor de site (zelfde regels als wss-devin)
      - /volume1/docker/wss-webserver/cron.d:/etc/cron.d
    stdin_open: true
    tty: true
    networks:
      docker_network:
        ipv4_address: 192.168.10.64

networks:
  docker_network:
    external: true
