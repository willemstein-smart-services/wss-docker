name: build-wss-webserver
on:
  workflow_dispatch:
    inputs:
      tag: { description: 'extra tag (leeg = latest+versie+sha)', required: false }
  push:
    paths: ['wss-webserver/**']

permissions:
  contents: read
  packages: write   # GITHUB_TOKEN -> ghcr.io/willemstein-smart-services

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: |
          v="$(grep -oP 'org\.opencontainers\.image\.version="\K[^"]+' wss-webserver/Dockerfile || true)"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/willemstein-smart-services/wss-webserver
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.tag }},enable=${{ steps.ver.outputs.tag != '' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: wss-webserver
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
