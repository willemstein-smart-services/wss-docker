; WSS PAC overrides (apache2 + cli)
display_errors=On
error_reporting=E_ALL
log_errors=On
error_log=/var/log/webstack/php-error.log
upload_max_filesize=64M
post_max_size=64M
memory_limit=512M
max_execution_time=120
; PAC: geen echte mail — sendmail gaat naar de catcher
sendmail_path=/usr/local/bin/mail-catch
